[project]
name = "pollscale-api"
version = "2.0.0"
description = "Pollscale FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy==2.0.52",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "PyJWT[crypto]==2.10.1",
    "httpx==0.28.1",
    "boto3==1.43.78",
    "python-multipart==0.0.32",
    "pillow==12.3.0",
    "bcrypt==5.0.0",
    "pyotp==2.10.0",
    "qrcode==8.2",
    "posthog==7.43.0",
    "apscheduler==3.11.3",
    "tzdata==2026.3",
    "sentry-sdk==2.68.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[tool.uv]
package = false
