version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /
      - /apps/web
      - /apps/admin
      - /apps/mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      uv:
        patterns: ["*"]
