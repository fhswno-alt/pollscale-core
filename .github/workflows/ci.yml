name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters.yml

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            zricethezav/gitleaks:v8.24.3 \
            detect --source=/src --verbose --redact --config=/src/.gitleaks.toml

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pollscale
          POSTGRES_PASSWORD: pollscale
          POSTGRES_DB: pollscale_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pollscale"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://pollscale:pollscale@127.0.0.1:5432/pollscale_test
      AUTO_SEED: "false"
      ALLOW_DEV_AUTH: "true"
      POLLSCALE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
      - name: Docker build
        working-directory: ${{ github.workspace }}
        run: docker build -t pollscale-api:ci apps/api

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @pollscale/web...
      - run: pnpm --filter @pollscale/web typecheck
      - run: pnpm --filter @pollscale/web lint
      - run: pnpm --filter @pollscale/web build

  admin:
    name: Admin
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @pollscale/admin...
      - run: pnpm --filter @pollscale/admin typecheck
      - run: pnpm --filter @pollscale/admin lint
      - run: pnpm --filter @pollscale/admin build

  mobile:
    name: Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @pollscale/mobile...
      - run: pnpm --filter @pollscale/mobile typecheck
      - run: pnpm --filter @pollscale/mobile lint
      - run: pnpm --filter @pollscale/mobile export

  result:
    name: CI result
    if: always()
    needs: [changes, secrets, api, web, admin, mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          set -euo pipefail
          test "${{ needs.changes.result }}" = "success"
          test "${{ needs.secrets.result }}" = "success"
          for job in api web admin mobile; do
            result=$(
              case "$job" in
                api) echo "${{ needs.api.result }}" ;;
                web) echo "${{ needs.web.result }}" ;;
                admin) echo "${{ needs.admin.result }}" ;;
                mobile) echo "${{ needs.mobile.result }}" ;;
              esac
            )
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "$job failed ($result)"
              exit 1
            fi
          done
